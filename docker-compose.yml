version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: sep490-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sep490}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-sep490}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sep490}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: sep490-api:latest
    build:
      context: Backend_SEP490
      dockerfile: Dockerfile
    env_file:
      - Backend_SEP490/.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:8080}
      WEBSITES_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
