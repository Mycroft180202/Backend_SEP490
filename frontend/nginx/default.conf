server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly
    location /static/ {
        try_files $uri $uri/ =404;
    }

    location /images/ {
        try_files $uri $uri/ =404;
    }

    # Fallback routing for the SPA so deep links work
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
